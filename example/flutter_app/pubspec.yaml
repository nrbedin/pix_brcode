name: pix_checkout_demo
description: App Flutter mínimo que mostra um fluxo de pagamento Pix com backend simulado, usando pix_brcode e qr_flutter.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_mobx: ^2.3.0
  flutter_modular: ^5.0.3
  mobile_scanner: ^6.0.11
  mobx: ^2.5.0
  pix_brcode:
    path: ../..
  qr_flutter: ^4.1.0
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  mobx_codegen: ^2.7.1
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
